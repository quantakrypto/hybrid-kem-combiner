[package]
name = "hybrid-kem-combiner"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Generic, standalone hybrid KEM combiner: the IND-CCA preserving construction of NIST SP 800-227 section 4.6.2 and draft-irtf-cfrg-hybrid-kems section 5.1.3, over any pair of KEMs"
repository = "https://github.com/quantakrypto/hybrid-kem-combiner"
homepage = "https://github.com/quantakrypto/hybrid-kem-combiner"
documentation = "https://docs.rs/hybrid-kem-combiner"
readme = "README.md"
# The conformance vectors live at the repository root and are shared with the
# TypeScript package, so the test that reads them cannot run from a published
# .crate. Run the suite from a checkout instead.
exclude = ["/tests"]
keywords = ["cryptography", "post-quantum", "kem", "hybrid", "combiner"]
categories = ["cryptography", "no-std"]

[features]
default = ["alloc"]
# Adds the `*_to_vec` helpers. The core combiner allocates nothing and does
# not need this.
alloc = ["zeroize/alloc"]

[dependencies]
hkdf = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
sha3 = { version = "0.12", default-features = false }
zeroize = { version = "1.9", default-features = false }

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
